name: security-onion-visibility-contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-onion-visibility-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Security Onion Visibility Contract
        run: python3 ./scripts/verify-security-onion-visibility-rollup.py
      - name: Verify Security Onion Cross-Source Corroboration Contract
        run: python3 ./scripts/verify-security-onion-cross-source-corroboration.py
