name: Cross Repo Claim Parity

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cross-repo-claim-parity:
    runs-on: ubuntu-latest
    env:
      DETECTIONS_SOURCE_SHA: eb8d39428c2aa2925db8350ebf586a82a6d109ee
      PROOF_SOURCE_SHA: 643ec75743bf9f8aa5552472ce8566643531d6bb
      WEBSITE_SOURCE_SHA: 588b7a48a51733a22666df913b234bd694d27c08
      COMMAND_CENTER_SOURCE_SHA: ac4677fb1273210154eb8c90805078e7dd492ac5
      PLATFORM_SOURCE_SHA: 0c9fa3654db8691c0730a5ddd1e74a343c62c3a2
    steps:
      - name: Checkout validation repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hawkinsoperations-validation
          persist-credentials: false

      - name: Checkout detections repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HawkinsOperations/hawkinsoperations-detections
          ref: ${{ env.DETECTIONS_SOURCE_SHA }}
          path: hawkinsoperations-detections
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout proof repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HawkinsOperations/hawkinsoperations-proof
          ref: ${{ env.PROOF_SOURCE_SHA }}
          path: hawkinsoperations-proof
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout website repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HawkinsOperations/hawkinsoperations-website
          ref: ${{ env.WEBSITE_SOURCE_SHA }}
          path: hawkinsoperations-website
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout org front door repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HawkinsOperations/.github
          ref: ${{ env.COMMAND_CENTER_SOURCE_SHA }}
          path: .github
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout platform repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HawkinsOperations/hawkinsoperations-platform
          ref: ${{ env.PLATFORM_SOURCE_SHA }}
          path: hawkinsoperations-platform
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Verify exact immutable sibling revisions
        run: |
          test "$(git -C hawkinsoperations-detections rev-parse HEAD)" = "$DETECTIONS_SOURCE_SHA"
          test "$(git -C hawkinsoperations-proof rev-parse HEAD)" = "$PROOF_SOURCE_SHA"
          test "$(git -C hawkinsoperations-website rev-parse HEAD)" = "$WEBSITE_SOURCE_SHA"
          test "$(git -C .github rev-parse HEAD)" = "$COMMAND_CENTER_SOURCE_SHA"
          test "$(git -C hawkinsoperations-platform rev-parse HEAD)" = "$PLATFORM_SOURCE_SHA"

      - name: Run fail-closed source parity and claim-boundary checks
        working-directory: hawkinsoperations-validation
        run: |
          python -B -m pip install PyYAML==6.0.2
          python -B scripts/verify_validation_registry.py \
            --detections-root ../hawkinsoperations-detections \
            --detections-ref "$DETECTIONS_SOURCE_SHA" \
            --source-manifest validation/SOURCE_AUTHORITY_MANIFEST.json
          python -B scripts/verify_all_validation_packages.py --source-contract required
          python -B scripts/verify_cross_repo_claim_parity.py \
            --repo-root .. \
            --enforce
