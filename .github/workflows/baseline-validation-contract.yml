name: baseline-validation-contract

on:
  pull_request:
    paths:
      - 'scripts/verify_validation_contract.py'
      - 'scripts/validation_lib.py'
      - 'validation/hero/001-powershell-encoded-command/**'
      - '.github/contracts/validation-report.schema.json'
      - '.github/workflows/baseline-validation-contract.yml'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_validation_contract.py'
      - 'scripts/validation_lib.py'
      - 'validation/hero/001-powershell-encoded-command/**'
      - '.github/contracts/validation-report.schema.json'
      - '.github/workflows/baseline-validation-contract.yml'
      - 'tests/**'

jobs:
  baseline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Self-test Baseline Validation Contract Checker
        run: python -B scripts/verify_validation_contract.py --self-test
      - name: Validate Baseline Validation Contract
        run: python -B scripts/verify_validation_contract.py
      - name: Unit Tests
        run: python -B -m unittest discover -s tests
