name: baseline-validation-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline-hero-validation-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DETECTION_SOURCE_SHA: 9c0cc25a48addde52bcbadbd4ea03c491e617420
    defaults:
      run:
        working-directory: hawkinsoperations-validation
    steps:
      - name: Checkout validation PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hawkinsoperations-validation
          persist-credentials: false
      - name: Checkout declared detection source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HawkinsOperations/hawkinsoperations-detections
          ref: ${{ env.DETECTION_SOURCE_SHA }}
          path: hawkinsoperations-detections
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact immutable detection revision
        working-directory: .
        run: |
          test "$(git -C hawkinsoperations-detections rev-parse HEAD)" = "$DETECTION_SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install workflow parser dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Reject retired fixture vocabulary
        run: |
          python - <<'PY'
          import subprocess
          import unicodedata
          from pathlib import PurePosixPath

          retired = "".join(("syn", "thetic"))
          binary_extensions = frozenset({
              ".7z", ".avif", ".avi", ".bz2", ".dll", ".dylib", ".eot", ".exe", ".gif",
              ".gz", ".ico", ".jpeg", ".jpg", ".mov", ".mp3", ".mp4", ".pdf",
              ".png", ".pyc", ".so", ".tar", ".tgz", ".ttf", ".wasm", ".webp",
              ".woff", ".woff2", ".xz", ".zip",
          })
          paths = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          ).stdout.decode("utf-8").split("\0")
          findings = []
          for relative in filter(None, paths):
              if retired in unicodedata.normalize("NFKC", relative).casefold():
                  findings.append(f"tracked filename: {relative}")
              if PurePosixPath(relative).suffix.casefold() in binary_extensions:
                  continue
              blob = subprocess.run(
                  ["git", "show", f":{relative}"],
                  check=True,
                  capture_output=True,
              ).stdout
              if b"\0" in blob:
                  findings.append(f"tracked non-binary content contains NUL: {relative}")
                  continue
              try:
                  text = blob.decode("utf-8")
              except UnicodeDecodeError:
                  findings.append(f"tracked non-binary content is not UTF-8: {relative}")
                  continue
              if retired in unicodedata.normalize("NFKC", text).casefold():
                  findings.append(f"tracked content: {relative}")
          if findings:
              raise SystemExit(
                  "retired fixture vocabulary found:\n- " + "\n- ".join(findings)
              )
          PY
      - name: Verify content-addressed source handoff
        run: |
          python -B scripts/refresh_validation_source_manifest.py \
            --detections-root ../hawkinsoperations-detections \
            --detections-ref "$DETECTION_SOURCE_SHA"
          python -B scripts/verify_validation_registry.py \
            --detections-root ../hawkinsoperations-detections \
            --detections-ref "$DETECTION_SOURCE_SHA" \
            --source-manifest validation/SOURCE_AUTHORITY_MANIFEST.json
      - name: Run every validator, parity check, and claim boundary
        run: |
          python -B scripts/verify_all_validation_packages.py --source-contract required
      - name: Run baseline and registry contracts
        run: |
          python -B scripts/verify_validation_contract.py
          python -B scripts/verify_wazuh_logtest_registry.py
          python -B scripts/verify_ho_lab_wazuh_001.py
      - name: Run hostile and full unit suites
        run: |
          python -B -m unittest discover -s tests
      - name: Verify no generated or whitespace drift
        run: |
          git diff --exit-code
          git diff --check

  source-executed-mutation-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DETECTION_SOURCE_SHA: 9c0cc25a48addde52bcbadbd4ea03c491e617420
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: hawkinsoperations-validation
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact detection source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HawkinsOperations/hawkinsoperations-detections
          ref: ${{ env.DETECTION_SOURCE_SHA }}
          path: hawkinsoperations-detections
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bounded predicate parser
        run: python -m pip install PyYAML==6.0.2
      - name: Attack predicate parsing and mutation accounting
        run: python -B -m unittest discover -s hawkinsoperations-validation/tests -p test_detection_quality.py -v
      - name: Execute source mutations and verify deterministic replay
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path.cwd()
          command = [sys.executable, "-B", str(root / "hawkinsoperations-validation/scripts/detection_quality.py"),
                     "--detections-root", str(root / "hawkinsoperations-detections"),
                     "--detections-ref", os.environ["DETECTION_SOURCE_SHA"]]
          first = subprocess.run(command, check=True, capture_output=True, text=True).stdout
          report = json.loads(first)
          output = Path(os.environ["RUNNER_TEMP"]) / "detection-quality.json"
          output.write_text(first, encoding="utf-8")
          replay = subprocess.run(command + ["--verify", str(output)], check=True, capture_output=True, text=True).stdout
          if first != replay:
              raise SystemExit("nondeterministic quality replay")
          print(json.dumps({key: report[key] for key in ("status", "detections_evaluated", "quality", "mutation_metrics", "replay_sha256")}, indent=2))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Controlled source predicate execution\n\n")
              summary.write(f"Runner: {os.environ['RUNNER_OS']}; six source rules; {report['quality']['events_evaluated']} controlled events.\n\n")
              summary.write("```json\n" + json.dumps(report["quality"], indent=2) + "\n" + json.dumps(report["mutation_metrics"], indent=2) + "\n```\n\n")
              summary.write("No fixture command or endpoint action executed. Not SIEM backend parity, runtime signal, public-safe proof, or human approval.\n")
      - name: Upload validation-owned replay record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: detection-quality-${{ matrix.os }}
          path: ${{ runner.temp }}/detection-quality.json
          if-no-files-found: error
          retention-days: 14
